{% extends 'userbase.html' %}
{% load static %}

{% block user %}

<div class="container-fluid">
    <div class="row">
        <div class="col-sm-6 mx-auto mb-4 p-2 border border-2 border-primary " style="box-shadow: 2px 2px 10px rgba(95, 104, 154, 0.701),-2px -2px 10px rgba(75, 75, 124, 0.701);">
            <div class="card mx-auto mx-3 my-auto  border border-2 border-light-subtle " >
                <h3 class="text-primary mx-auto p-2">User Profile</h3>
            </div>
        </div>
        
    </div>
    <div class="row">
        <div class="col-sm-6 mx-auto  p-4 border border-2 border-primary " style="box-shadow: 4px 4px 10px rgba(70, 78, 121, 0.701),-4px -4px 10px rgba(75, 75, 128, 0.701);">
            <div class="card mx-auto p-4 m-2 border border-2 border-light-subtle " >
                <div class="text-center " >
                    {% if user.profile %}
                    <img src="{{user.profile.url}}" alt="" height="150px" class="rounded-circle">
                    {% else %}
                    <img src="{% static 'img/profile.png' %}" alt="" height="150px" width="170px" class="rounded-circle border border-1 border-primary">
                    {% endif %}
                    <h5 class="mt-3">{{user.name}}</h5>
                </div>
                <hr>
                <p>
                    <b>Email</b>: {{user.email}}
                    <br>
                    <b>Contact Number</b>: {{user.contactnumber}}
                    <br>
                    <b>Address</b>: {{user.address}}
                </p>
                <hr>
                <div class="text-center">
                    <a href="{% url 'editprofile' %}" class=" btn btn-primary  btn-sm fw-bold ">Edit Profile</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
