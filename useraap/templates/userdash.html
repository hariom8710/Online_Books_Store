{% extends 'userbase.html' %}
{% load static %}
{% block user %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <h2 class="mb-4">User Dashboard</h2>
        </div>
    </div>
    <div class="row">
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="fas fa-user fa-2x mb-2"></i>
                    <h5 class="card-title">Profile</h5>
                    <a href="{% url 'userprofile' %}" class="btn btn-outline-primary btn-sm">View Profile</a>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="fas fa-shopping-cart fa-2x mb-2"></i>
                    <h5 class="card-title">Cart</h5>
                    <a href="{% url 'viewcart' %}" class="btn btn-outline-primary btn-sm">View Cart</a>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="fas fa-box fa-2x mb-2"></i>
                    <h5 class="card-title">Orders</h5>
                    <a href="{% url 'userorders' %}" class="btn btn-outline-primary btn-sm">View Orders</a>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="fas fa-key fa-2x mb-2"></i>
                    <h5 class="card-title">Change Password</h5>
                    <a href="{% url 'user_ch_pwd' %}" class="btn btn-outline-primary btn-sm">Change Password</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
