{% extends 'adminbase.html' %}
{% load static %}

{% block admin %}
<div class="container-fludi">
    <div class="row">
        <div class="col-sm-8 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Add Category</h3>
                </div>
                <div class="card-body">
                    <form method="POST" action="{% url 'addcat' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="name " class="form-label">Category Name</label>
                            <input type="text" name="name" id="name" class="form-control" placeholder="Enter Category Name" required>

                        </div>
                        <div class="mb-3">
                            <label for="desc" class="form-label">Description</label>
                            <textarea type="text" name="description" id="desc" class="form-control" placeholder="Enter Category Description"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-4" name="addcat " onclick="Category()" >Add Category</button>
                    </form>
                </div>
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
