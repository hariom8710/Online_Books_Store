
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Dashboard</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Bootstrap CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            .sidenav {
                height: 100%;
                width: 0;
                position: fixed;
                z-index: 1050;
                top: 0;
                left: 0;
                background-color: #343a40;
                overflow-x: hidden;
                transition: 0.3s;
                padding-top: 60px;
            }
            .sidenav a {
                padding: 10px 30px;
                text-decoration: none;
                font-size: 1.1rem;
                color: #f8f9fa;
                display: block;
                transition: 0.2s;
            }
            .sidenav a:hover {
                background: #495057;
            }
            .sidenav .closebtn {
                position: absolute;
                top: 15px;
                right: 25px;
                font-size: 2rem;
                color: #f8f9fa;
            }
            .dashboard-content {
                margin-left: 0;
                transition: margin-left 0.3s;
            }
            @media (min-width: 768px) {
                .dashboard-content {
                    margin-left: 250px;
                }
                .sidenav {
                    width: 250px;
                }
            }
        </style>
    </head>
    <body class=" text-white ">
        <!-- Sidenav -->
        <div id="mySidenav" class="sidenav bg-primary">
            <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
            <a href="#">Dashboard</a>
            <a href="#">Users</a>
            <a href="#">Settings</a>
            <a href="#">Reports</a>
            <a href="#">Logout</a>
        </div>

        <!-- Top Navbar -->
        <nav class="navbar navbar-dark bg-primary fixed-top text-white">
            <div class="container-fluid">
                <button class="btn btn-outline-light" type="button" onclick="openNav()">
                    &#9776; Menu
                </button>
                <span class="navbar-brand mb-0 h1">Admin Dashboard</span>
                </div>     </nav>

        <!-- Main Content -->
        <div class="container dashboard-content mt-4" id="mainContent">
            <h2>Welcome to the Dashboard</h2>
            <p>This is your admin panel. Use the menu to navigate.</p>
        </div>
        <script>
            function openNav() {
                document.getElementById("mySidenav").style.width = "250px";
                document.getElementById("mainContent").style.marginLeft = "250px";
            }
            function closeNav() {
                document.getElementById("mySidenav").style.width = "0";
                document.getElementById("mainContent").style.marginLeft = "0";
            }
        </script>      <!-- Bootstrap JS CDN -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function openNav() {
                document.getElementById("mySidenav").style.width = "250px";
            }
            function closeNav() {
                document.getElementById("mySidenav").style.width = "0";
            }
        </script>
    </body>
    </html>
