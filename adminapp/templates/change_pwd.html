{% extends 'adminbase.html' %}
{% load static %}

{% block admin %}
<div class="container ">
    <div class="row mt-lg-4">
        <div class="col-sm-6 mx-auto my-auto">
            <div class="card mx-auto my-auto border rounded-3" style="box-shadow:3px 3px 15px rgba(24, 24, 112, 0.455),-3px -3px 15px rgba(38, 38, 76, 0.455);">
                <div class="change_pwd-heading p-2 m-2 border-4 border-light rounded-2" style="background-color: rgb(136, 199, 255);">
                    <h3 class="text-center text-primary fw-bolder ">Change Password</h3>
                </div>
                <div class="card-body p-2 m-2 border border-2 border-primary ">
                    {% if msg %}
                      <div class="alert alert-info text-center">{{ msg }}</div>
                    {% endif %}
                    <form method="POST" class="form text-primary fw-bolder ">
                        {% csrf_token %}
                        <div class="mb-3 p-2">
                            <label for="old_password" class="form-label">Old Password</label>
                            <input type="password" name="old_password" id="old_password" class="form-control" placeholder="Enter Old Password" required>
                        </div>
                        <div class="mb-3 p-2">
                            <label for="new_password" class="form-label">New Password</label>
                            <input type="password" name="new_password" id="new_password" class="form-control" placeholder="Enter New Password" required>
                        </div>
                        <div class="mb-3 p-2">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirm New Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 p-2 mb-2 ">Change Password</button>
                    </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
